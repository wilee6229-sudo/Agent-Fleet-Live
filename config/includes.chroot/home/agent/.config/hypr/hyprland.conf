monitor = , preferred, auto, 1
input { kb_layout = us; follow_mouse = 1 }
general {
    gaps_in = 5; gaps_out = 10; border_size = 2
    col.active_border = rgba(4CAF50ee) rgba(2196F3ee) 45deg
    col.inactive_border = rgba(595959aa)
    layout = dwindle
}
decoration { rounding = 8; blur { enabled = true; size = 3; passes = 1 } }
animations { enabled = true }
dwindle { pseudotile = true; preserve_split = true }
$term = kitty
bind = SUPER, Return, exec, $term
bind = SUPER, Q, killactive
bind = SUPER, F, fullscreen
bind = SUPER, D, exec, wofi --show drun
bind = SUPER, B, exec, epiphany
bind = SUPER, T, exec, kitty tmux new-session -s fleet \; split-window -h \; split-window -v \; select-pane -t 0 \; send-keys 'htop' Enter \; select-pane -t 1 \; send-keys 'fleet status' Enter
bind = SUPER, P, exec, grim -g "$(slurp)" - | wl-copy
bind = SUPER, L, exec, hyprlock
exec-once = dunst
exec-once = waybar
exec-once = pipewire
exec-once = pipewire-pulse
exec-once = wireplumber
exec-once = hyprpaper
exec-once = hypridle
exec-once = /usr/libexec/xdg-desktop-portal-hyprland
exec-once = hyprpolkitagent
