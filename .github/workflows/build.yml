name: Build Agent Fleet ISO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # no timeout
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap squashfs-tools xorriso

      - name: Build ISO
        run: |
          sudo rm -rf config/chroot config/.build config/cache config/auto
          sudo lb clean --config config || true
          sudo lb config --config config noauto --distribution noble --mode ubuntu --archive-areas "main restricted universe multiverse" --architectures amd64 --bootloader grub --binary-images iso-hybrid --debian-installer live --memtest none --parent-mirror-bootstrap "http://archive.ubuntu.com/ubuntu" --parent-mirror-chroot "http://archive.ubuntu.com/ubuntu" --parent-mirror-chroot-security "http://security.ubuntu.com/ubuntu" --parent-mirror-binary "http://archive.ubuntu.com/ubuntu" --parent-mirror-binary-security "http://security.ubuntu.com/ubuntu" --iso-application "Agent Fleet Live" --iso-publisher "Agent Fleet" --iso-volume "AGENT-FLEET-LIVE" --apt-indices false --apt-recommends false --security true --backports false --compression gzip
          sudo lb build --config config
          echo "Build exit code: $?"
          find . -type f \( -name "*.iso" -o -name "*.img" \) 2>/dev/null
          ls -la

      - name: Find ISO
        id: find-iso
        run: |
          ISO=$(find . -type f \( -name "*.iso" -o -name "*.img" \) | head -1)
          if [ -z "$ISO" ]; then
            echo "ISO not found!"
            ls -la config/
            exit 1
          fi
          echo "iso_path=$ISO" >> $GITHUB_OUTPUT
          echo "Found: $ISO"
          ls -lh "$ISO"

      - name: Upload ISO as artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-fleet-live
          path: ${{ steps.find-iso.outputs.iso_path }}
          retention-days: 30

      - name: Create Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Agent Fleet Live Build ${{ github.run_number }}
          files: ${{ steps.find-iso.outputs.iso_path }}
          generate_release_notes: true
