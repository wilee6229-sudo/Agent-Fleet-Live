name: Build Agent Fleet ISO

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap squashfs-tools xorriso

      - name: Configure and Build ISO
        run: |
          sudo lb clean || true
          sudo bash config/build
          sudo lb build > /tmp/build.log 2>&1
          echo "Build exit code: $?"
          find . -type f \( -name "*.iso" -o -name "*.img" \) 2>/dev/null
          ls -la

      - name: Find ISO
        id: find-iso
        run: |
          echo "Searching for ISO..."
          find . -type f -name "*.iso" -o -name "*.img" -o -name "*.hybrid" 2>/dev/null
          echo "---"
          ls -laR . | grep -i "iso\|img\|hybrid\|binary" | head -20
          ISO=$(find . -type f \( -name "*.iso" -o -name "*.img" \) | head -1)
          if [ -z "$ISO" ]; then
            echo "No ISO found. Build directory contents:"
            ls -la
            exit 1
          fi
          echo "iso_path=$ISO" >> $GITHUB_OUTPUT
          echo "Found: $ISO"
          ls -lh "$ISO"

      - name: Upload ISO as artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-fleet-live
          path: ${{ steps.find-iso.outputs.iso_path }}
          retention-days: 30

      - name: Create Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Agent Fleet Live Build ${{ github.run_number }}
          files: ${{ steps.find-iso.outputs.iso_path }}
          generate_release_notes: true
