name: Build Agent Fleet ISO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # no timeout
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap squashfs-tools xorriso

      - name: Build ISO
        run: |
          cd config
          sudo rm -rf chroot .build cache auto binary
          sudo lb clean || true
          sudo bash build
          sudo lb bootstrap
          sudo lb chroot || true
          sudo lb binary
          sudo lb image
          echo "Build exit code: $?"

      - name: Find ISO
        id: find-iso
        run: |
          # Search parent directory first, then fallback to config/
          ISO_FILE=$(find . -maxdepth 2 -name "*.hybrid.iso" | head -n 1)
          if [ -z "$ISO_FILE" ]; then
            ISO_FILE=$(find config -maxdepth 2 -name "*.hybrid.iso" -o -name "*.iso" -o -name "*.img" | head -n 1)
          fi
          if [ -z "$ISO_FILE" ]; then
            echo "❌ Error: ISO artifact not found!"
            ls -la config/ 2>/dev/null || true
            find . -type f -name "*.iso" -o -name "*.img" 2>/dev/null
            exit 1
          fi
          echo "✅ Found build artifact at: $ISO_FILE"
          echo "iso_path=$ISO_FILE" >> $GITHUB_OUTPUT
          ls -lh "$ISO_FILE"

      - name: Upload ISO as artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-fleet-live
          path: ${{ steps.find-iso.outputs.iso_path }}
          retention-days: 30

      - name: Create Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Agent Fleet Live Build ${{ github.run_number }}
          files: ${{ steps.find-iso.outputs.iso_path }}
          generate_release_notes: true
