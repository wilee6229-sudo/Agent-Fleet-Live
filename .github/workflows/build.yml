name: Build Agent Fleet ISO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # no timeout
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap squashfs-tools xorriso

      - name: Build ISO
        run: |
          cd config
          sudo rm -rf chroot .build cache auto binary
          sudo lb clean || true
          sudo bash build
          set +e
          sudo lb build
          echo "Build exit code: $?"
          set -e
          find . -type f \( -name "*.iso" -o -name "*.img" \) 2>/dev/null
          ls -la

      - name: Find ISO
        id: find-iso
        run: |
          ISO=$(find config -type f \( -name "*.iso" -o -name "*.img" \) | head -1)
          if [ -z "$ISO" ]; then
            echo "ISO not found!"
            ls -la config/
            exit 1
          fi
          echo "iso_path=$ISO" >> $GITHUB_OUTPUT
          echo "Found: $ISO"
          ls -lh "$ISO"

      - name: Upload ISO as artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-fleet-live
          path: ${{ steps.find-iso.outputs.iso_path }}
          retention-days: 30

      - name: Create Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Agent Fleet Live Build ${{ github.run_number }}
          files: ${{ steps.find-iso.outputs.iso_path }}
          generate_release_notes: true
