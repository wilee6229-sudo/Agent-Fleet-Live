name: Build Agent Fleet ISO

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap squashfs-tools xorriso qemu-user-static binfmt-support

      - name: Build ISO
        run: |
          cd config
          sudo rm -rf chroot .build cache auto binary
          sudo lb clean || true
          sudo bash build
          # Run lb build but catch its exit code
          set +e
          sudo lb build 2>&1
          EXIT_CODE=$?
          set -e
          echo "lb build exit code: $EXIT_CODE"
          echo "--- Searching for ISO ---"
          find . -type f \( -name "*.iso" -o -name "*.img" \) 2>/dev/null
          ls -la

      - name: Find ISO
        id: find-iso
        run: |
          ISO=$(find . -type f \( -name "*.hybrid.iso" -o -name "*.iso" -o -name "*.img" \) | head -1)
          if [ -z "$ISO" ]; then
            echo "No ISO found. Searching broadly..."
            find . -type f \( -name "*.iso" -o -name "*.img" \) 2>/dev/null
            ls config/
            ls binary/ 2>/dev/null || true
            exit 1
          fi
          echo "iso_path=$ISO" >> $GITHUB_OUTPUT
          echo "Found: $ISO"
          ls -lh "$ISO"

      - name: Upload ISO as artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-fleet-live
          path: ${{ steps.find-iso.outputs.iso_path }}
          retention-days: 30

      - name: Create Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Agent Fleet Live Build ${{ github.run_number }}
          files: ${{ steps.find-iso.outputs.iso_path }}
          generate_release_notes: true
